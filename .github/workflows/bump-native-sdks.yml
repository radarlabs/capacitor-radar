# Bump Native SDK version numbers whenever a repository dispatch of a release
# is received
name: Bump Native SDKs
on:
  repository_dispatch:
    types: ['ios-sdk-release', 'android-sdk-release']
jobs:
  update_android_sdk_version:
    runs-on: ubuntu-latest
    if: github.event.client_payload.platform == 'android'
    steps:
      # Read the release version from an env var, not from inline ${{ }} in shell,
      # and accept only a semver value.
      - name: Validate release version
        id: release
        env:
          RELEASE: ${{ github.event.client_payload.release }}
        run: |
          if [[ ! "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid release version: $RELEASE" >&2
            exit 1
          fi
          echo "Android SDK release $RELEASE"
          echo "version=$RELEASE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Bump io.radar:sdk in android/build.gradle
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          sed -i -E "s|'io\.radar:sdk:[^']+'|'io.radar:sdk:${VERSION}'|" android/build.gradle
          grep -q "'io.radar:sdk:${VERSION}'" android/build.gradle

      # The example app gets the SDK through the plugin, so it needs no change.
      # The plugin version is separate from the native SDK version. Set it by hand at release time.

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bump/radar-sdk-android-${{ steps.release.outputs.version }}
          title: Automated radar-sdk-android version bump to ${{ steps.release.outputs.version }}
          body: |
            Bumps `io.radar:sdk` to ${{ steps.release.outputs.version }}.

            Before you merge:
            - [ ] Make sure `io.radar:sdk-fraud` in `android/build.gradle` is compatible with this core SDK version. See the native `MIGRATION.md`.
            - [ ] Set the plugin version in `package.json` if this PR goes into a release.
          reviewers: radarlabs/eng
          token: ${{ secrets.GITHUB_TOKEN }}
  update_ios_sdk_version:
    runs-on: ubuntu-latest
    if: github.event.client_payload.platform == 'ios'
    steps:
      # Read the release version from an env var, not from inline ${{ }} in shell,
      # and accept only a semver value.
      - name: Validate release version
        id: release
        env:
          RELEASE: ${{ github.event.client_payload.release }}
        run: |
          if [[ ! "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid release version: $RELEASE" >&2
            exit 1
          fi
          echo "iOS SDK release $RELEASE"
          echo "version=$RELEASE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      # Download the new core xcframework zip and compute its sha256
      # (SPM binaryTarget checksum == sha256 of the zip, so this matches the script's expectation)
      - name: Compute RadarSDK checksum
        id: sdk
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          URL="https://github.com/radarlabs/radar-sdk-ios/releases/download/${VERSION}/RadarSDK.xcframework.zip"
          curl -fsSL -o /tmp/RadarSDK.zip "$URL"
          SHA=$(sha256sum /tmp/RadarSDK.zip | awk '{print $1}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Update download script (version + checksum)
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.sdk.outputs.sha }}
        run: |
          sed -i "s|^SDK_VERSION=.*|SDK_VERSION=\"\${1:-${VERSION}}\"|" scripts/download-xcframeworks.sh
          sed -i "s|^SDK_SHA256=.*|SDK_SHA256=\"${SHA}\"|" scripts/download-xcframeworks.sh

      - name: Refresh vendored xcframeworks
        run: bash scripts/download-xcframeworks.sh

      - name: Bump RadarSDK SPM constraint in Package.swift
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          sed -i -E "s|(radar-sdk-ios-spm\.git\", \.upToNextMinor\(from: \")[^\"]+\"|\1${VERSION}\"|" Package.swift
          grep -q "radar-sdk-ios-spm.git\", .upToNextMinor(from: \"${VERSION}\")" Package.swift

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bump/radar-sdk-ios-${{ steps.release.outputs.version }}
          title: Automated radar-sdk-ios version bump to ${{ steps.release.outputs.version }}
          body: |
            Bumps `RadarSDK` to ${{ steps.release.outputs.version }}.

            Before you merge:
            - [ ] Make sure `RadarSDKFraud` (`FRAUD_VERSION` in `scripts/download-xcframeworks.sh` and `Package.swift`) is compatible with this core SDK version. See the native `MIGRATION.md`.
            - [ ] Set the plugin version in `package.json` if this PR goes into a release.
          reviewers: radarlabs/eng
          token: ${{ secrets.GITHUB_TOKEN }}
